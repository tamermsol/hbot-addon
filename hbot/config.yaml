name: HBot
version: "1.1.2"
slug: hbot
description: Bring your H-Bot (Tasmota) devices into Home Assistant over your local network — no cloud.
url: https://github.com/tamermsol/hbot-addon
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
# The add-on needs HA's built-in MQTT broker (Mosquitto) to publish discovery + relay control.
services:
  - mqtt:need
# host_network lets the add-on reach devices directly on your LAN by their IP.
host_network: true
init: false
# User-editable options. Auto-discovery is ON by default, so `devices` is optional —
# leave it empty and the add-on finds HBot devices on your LAN by itself. Add IPs only to
# force-include a device (e.g. one on a different subnet the sweep won't reach).
options:
  autodiscover: true
  devices: []
  subnets: []
  poll_interval: 10
  discovery_prefix: homeassistant
  debug: false
schema:
  autodiscover: bool
  devices:
    - str?
  subnets:
    - str?
  poll_interval: int(2,300)
  discovery_prefix: str
  debug: bool
