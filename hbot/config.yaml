name: HBot
version: "1.4.2"
slug: hbot
description: Bring your H-Bot (Tasmota) devices into Home Assistant over your local network — no cloud. Optional one-tap remote access via a secure Cloudflare tunnel.
url: https://github.com/tamermsol/hbot-addon
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
# The add-on needs HA's built-in MQTT broker (Mosquitto) to publish discovery + relay control.
services:
  - mqtt:need
# host_network lets the add-on reach devices directly on your LAN by their IP.
host_network: true
# homeassistant_api gives the add-on its SUPERVISOR_TOKEN access to the Core API
# (http://supervisor/core/api/…). We use it to verify the token authenticates before writing it into
# the H-Bot app's connection row, so pairing never leaves the app "connected but 401" (v1.4.1 fix).
homeassistant_api: true
init: false
# User-editable options. Auto-discovery is ON by default, so `devices` is optional —
# leave it empty and the add-on finds HBot devices on your LAN by itself.
#
# account_email / account_password: your H-Bot app login. When set, ONLY devices registered to
# your account are discovered (matched by topic/MAC) — other HBot/Tasmota devices on the LAN are
# ignored. Leave blank to discover any device named 'hbot' on the network.
options:
  account_email: ""
  account_password: ""
  autodiscover: true
  devices: []
  subnets: []
  poll_interval: 10
  discovery_prefix: homeassistant
  debug: false
  # Remote access (optional). When home_id + provisioning_token are set (auto-filled when you pair
  # this HA in the H-Bot app), the add-on opens a secure Cloudflare tunnel on first boot so the app
  # reaches HA from anywhere — no port forwarding, no cloud subscription. Leave blank for LAN-only.
  hbot_connect_url: "https://connect.aiawareworld.tech"
  home_id: ""
  provisioning_token: ""
  supabase_url: ""
  supabase_anon_key: ""
schema:
  account_email: str?
  account_password: password?
  autodiscover: bool
  devices:
    - str?
  subnets:
    - str?
  poll_interval: int(2,300)
  discovery_prefix: str
  debug: bool
  hbot_connect_url: str?
  home_id: str?
  provisioning_token: password?
  supabase_url: str?
  supabase_anon_key: password?
