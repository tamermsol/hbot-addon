name: HBot
version: "1.4.26"
slug: hbot
description: Connect your H-Bot smart devices to Home Assistant over your local network — no cloud, no setup. Your lights, panels and shutters appear automatically and work both ways. Optional secure remote access included.
url: https://github.com/tamermsol/hbot-addon
# Auto-start on HA boot + let the Supervisor watchdog auto-restart the add-on if it wedges. The bridge
# opens a plain TCP health port (8099) the watchdog polls; combined with the cloudflared supervised
# retry loop in addon-connect.sh, the remote tunnel now self-heals instead of silently dying (the
# Cloudflare 530/1033 "no origin" symptom). (v1.4.4)
boot: auto
startup: application
watchdog: "tcp://[HOST]:[PORT:8099]"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
# The add-on needs HA's built-in MQTT broker (Mosquitto) to publish discovery + relay control.
services:
  - mqtt:need
# host_network lets the add-on reach devices directly on your LAN by their IP.
host_network: true
# homeassistant_api gives the add-on its SUPERVISOR_TOKEN access to the Core API
# (http://supervisor/core/api/…). We use it to verify the token authenticates before writing it into
# the H-Bot app's connection row, so pairing never leaves the app "connected but 401" (v1.4.1 fix).
homeassistant_api: true
# hassio_api + hassio_role: manager let the add-on call the Supervisor API to enable its OWN
# auto-update (POST /addons/self/options {auto_update:true}) on first boot — so non-technical clients
# get every future fix automatically with zero taps. (v1.4.5)
hassio_api: true
hassio_role: manager
# homeassistant_config:rw lets the add-on write a config package (packages/hbot_tunnel.yaml) that sets
# http.trusted_proxies for the cloudflared tunnel — without it, HA 400s every tunnelled request
# (X-Forwarded-For from an untrusted proxy). Only the tunnel-trust package is written; user config is
# never modified in place. (v1.4.3)
map:
  - homeassistant_config:rw
init: false
# User-editable options. Auto-discovery is ON by default, so `devices` is optional —
# leave it empty and the add-on finds HBot devices on your LAN by itself.
#
# account_email / account_password: your H-Bot app login. When set, ONLY devices registered to
# your account are discovered (matched by topic/MAC) — other devices on the LAN are
# ignored. Leave blank to discover any device named 'hbot' on the network.
options:
  account_email: ""
  account_password: ""
  autodiscover: true
  devices: []
  subnets: []
  poll_interval: 10
  discovery_prefix: homeassistant
  debug: false
  # Remote access (optional). When home_id + provisioning_token are set (auto-filled when you pair
  # this HA in the H-Bot app), the add-on opens a secure Cloudflare tunnel on first boot so the app
  # reaches HA from anywhere — no port forwarding, no cloud subscription. Leave blank for LAN-only.
  hbot_connect_url: "https://connect.aiawareworld.tech"
  home_id: ""
  provisioning_token: ""
  supabase_url: ""
  supabase_anon_key: ""
schema:
  account_email: str?
  account_password: password?
  autodiscover: bool
  devices:
    - str?
  subnets:
    - str?
  poll_interval: int(2,300)
  discovery_prefix: str
  debug: bool
  hbot_connect_url: str?
  home_id: str?
  provisioning_token: password?
  supabase_url: str?
  supabase_anon_key: password?
